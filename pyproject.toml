[project]
name = "moescope"
version = "0.1.0"
description = "Profile which experts your workload uses in an open Mixture-of-Experts model, and turn that into cache and pruning decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "polars>=1.20",
    "pyarrow>=17",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.scripts]
moescope = "moescope.cli:app"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.45"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a real model download (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
